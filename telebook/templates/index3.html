<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Patrol Monitoring</title>

<body>

<h2>Please enter the new site name</h2>
<p>

<form method="post" action="/addnewsite">
    <dl>

			<input type="file" name="file" multiple="false" autocomplete="off" required>

		<p>
			Enter New site ID: <input type="text" name="sitename" >

		</p>

				<option value={{i.name}}>{{i.name}}</option>
				{% endfor %}
			{% endif %}
		</select>
		</p>

		<p>
			Please select the Method:
		<select id="method" name="method">
			<option value="volvo">-------</option>
			<option value="1">Generate QR Codes, Floor/buidling wise</option>
			<option value="2">Generate All QR codes</option>

		</select>
		</p>
    </dl>
    <p>
		<input type="submit" value="Submit">
	</p>
