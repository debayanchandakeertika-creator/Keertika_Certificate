<!DOCTYPE html>
<html>
<head>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #dddddd;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrol Monitoring</title>
</head>
<body>

<h2>Please add place names</h2>
<form method="post" action="/pdf_gen">
<table>
  <thead>
  <tr>
    <th>QR ID</th>
    <th>Please enter Building Name</th>
    <th>Please enter Floor Name</th>
    <th>Please enter Place Name</th>
    <th>Shift</th>
    <th>Type</th>
  </tr>
  </thead>
  <tbody>
  {% if d %}  
    {% for i in d %}
      <tr>
        <td><input style="width: 80%" type="text" value={{i.qr_code}} name={{i.uuid_nam}} readonly></td>
        <td><input type="text" name={{i.build_nam}} value="{{build}}" ></td>
        <td><input type="text" name={{i.floor_nam}} value="{{fl}}" ></td>
        <td><input type="text" name={{i.field_nam}} ></td>
        <td>
          <select id="{{i.shift_name}}" name="{{i.shift_name}}">
      <option value="">----</option>
        <option value="ALL">ALL</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="G">G</option>
        <option value="AC">AC</option>
        <option value="M">M</option>
        <option value="AB">AB</option>
        <option value="GC">GC</option>
        <option value="D">D</option>
        <option value="ABCD">ABCD</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="EF">EF</option>
        <option value="G">G</option>
        <option value="H">H</option>
        <option value="I">I</option>


    </select>
        </td>
        <td>
          <select id="{{i.type_name}}" name="{{i.type_name}}">
      <option value="volvo">----</option>
        <option value="post">Post Monitoring</option>
        <option value="patrol">Patrol Monitoring</option>
        <option value="house">HOUSEKEEPING</option>
    </select>
        </td>
      </tr>
    {% endfor %}
  {% endif %}
  <tr>
    <td>
      Summary
    </td>
    <td>
      <p>Site Name:<input type="text" name=site_name value="{{site}}" readonly></p>
    </td>
    <td>
      <p>QR Codes: <input type="text" name=qr_con value={{con}} readonly></p>
    </td>
    <td><input type="submit" value="Submit"></td>
    <td></td>
    <td></td>
  </tr>
  </tbody>
  
</table>
</form>

</body>
</html>
